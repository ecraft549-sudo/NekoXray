name: Release Multi-ABI APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36.1 and accept licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare release signing keystore
        id: signing
        env:
          SECRET_KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KS_PATH="${{ runner.temp }}/release-upload.jks"
          if [ -n "$SECRET_KS" ]; then
            echo "$SECRET_KS" | base64 -d > "$KS_PATH"
            echo "STORE_PASS=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not configured. Generating ephemeral CI keystore for release signing."
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storepass "nekoxray-ci-pass" \
              -keypass "nekoxray-ci-pass" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NekoXray CI, O=NekoXray, C=US"
            echo "STORE_PASS=nekoxray-ci-pass" >> "$GITHUB_ENV"
            echo "KEY_PASS=nekoxray-ci-pass" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Download Xray core (libv2ray.aar)
        run: gradle :app:downloadLibv2ray --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build per-architecture Release APKs & AAB
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: gradle assembleRelease bundleRelease -PenableAbiSplits=true --no-daemon

      - name: Package release artifacts & SHA-256 checksums
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p release-artifacts

          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            SRC="app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "release-artifacts/NekoXray-${TAG}-${abi}.apk"
            fi
          done

          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB" ]; then
            cp "$AAB" "release-artifacts/NekoXray-${TAG}.aab"
          fi

          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          ls -lh release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: NekoXray ${{ steps.pkg.outputs.tag }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/SHA256SUMS.txt
